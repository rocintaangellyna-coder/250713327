<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>

    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>

    <div class="container">

        <h1>Formulir Pendaftaran Seminar</h1>
        <p class="subtitle">Silakan lengkapi data berikut untuk melakukan pendaftaran seminar.</p>

        <form action="" method="post" enctype="multipart/form-data">

            <h3>Data Peserta</h3>
            <table cellspacing="4" cellpadding="4" border="1">

                <tr>
                    <td class="label-column">
                        <label for="nama"><strong>Nama Lengkap</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nama" name="nama" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="label-column">
                        <label for="nim"><strong>NIM</strong></label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="label-column">
                        <strong>Jenis Kelamin</strong>
                    </td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-Laki" />
                        <label for="laki">Laki-Laki</label>

                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>

                <tr>
                    <td class="label-column">
                        <label for="prodi"><strong>Program Studi</strong></label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>

            </table>

            <h3>Pilihan Seminar</h3>
            <table cellspacing="4" cellpadding="4" border="1">

                <tr>
                    <td class="label-column">
                        <strong>Jenis Tiket</strong>
                    </td>
                    <td>
                        <input type="radio" id="reguler" name="tiket" value="Reguler" />
                        <label for="reguler">Reguler</label>

                        <input type="radio" id="vip" name="tiket" value="VIP" />
                        <label for="vip">VIP</label>
                    </td>
                </tr>

                <tr>
                    <td class="label-column">
                        <strong>Topik Seminar</strong>
                    </td>
                    <td>
                        <input type="checkbox" id="web" name="topik" value="Web Development" />
                        <label for="web">Web Development</label>

                        <br />

                        <input type="checkbox" id="data" name="topik" value="Data Science" />
                        <label for="data">Data Science</label>

                        <br />

                        <input type="checkbox" id="ai" name="topik" value="Artificial Intelligence" />
                        <label for="ai">Artificial Intelligence</label>
                    </td>
                </tr>

            </table>

            <h3>Informasi Tambahan</h3>
            <table cellspacing="4" cellpadding="4" border="1">

                <tr>
                    <td class="label-column">
                        <label for="alasan">
                            <strong>Alasan Mengikuti Seminar</strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="alasan" name="alasan" rows="10" cols="23"></textarea>
                    </td>
                </tr>

                <tr>
                    <td class="label-column">
                        <label for="bukti">
                            <strong>Bukti Pembayaran</strong>
                        </label>
                    </td>
                    <td>
                        <input type="file" id="bukti" name="bukti" />
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="button-column">
                        <input type="submit" name="simpan" value="Simpan Pendaftaran" />
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>
</html>
